name: Update cask

on:
  schedule:
    - cron: "17 */6 * * *"
  repository_dispatch:
    types: [release]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Bump to latest BetterNotes release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=$(gh release view --repo 1grzyb1/betternotes --json tagName --jq .tagName)
          VERSION=${TAG#v}
          CURRENT=$(sed -nE 's/^  version "(.*)"/\1/p' Casks/betternotes.rb)
          if [ "$VERSION" = "$CURRENT" ]; then echo "Up to date ($VERSION)"; exit 0; fi
          curl -fsSL -o app.zip "https://github.com/1grzyb1/betternotes/releases/download/$TAG/BetterNotes-macos-universal.zip"
          SHA=$(sha256sum app.zip | cut -d' ' -f1)
          rm app.zip
          sed -i -E "s/^  version \".*\"/  version \"$VERSION\"/; s/^  sha256 \".*\"/  sha256 \"$SHA\"/" Casks/betternotes.rb
          git -c user.name=github-actions -c user.email=github-actions@users.noreply.github.com \
            commit -qam "betternotes $VERSION"
          git push -q
